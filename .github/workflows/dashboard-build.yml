name: Dashboard build

# Builds dashboard-web on a GitHub-hosted runner (ample memory) so build breakage is caught on
# every push and a prebuilt .next artifact is available to download. The VM should NOT run
# `next build` — it OOMs/hangs on the small box (see the 2026-06-16 deploy incident). Long term,
# the VM deploy can fetch this artifact instead of building locally.

on:
  push:
    branches: [main, claude/eager-curie-tfw2zc]
    paths: ["dashboard-web/**", ".github/workflows/dashboard-build.yml"]
  pull_request:
    paths: ["dashboard-web/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-next-build
          path: |
            dashboard-web/.next
            !dashboard-web/.next/cache
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
