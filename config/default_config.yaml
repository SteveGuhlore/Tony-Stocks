provider: alpaca_iex
real_data_only: true
allow_demo_fallback_in_watch: false
allow_demo_snapshots: false
allow_demo_in_learning: false
allow_demo_in_analytics: false
database_path: data/trading_bot.db
outputs_dir: outputs
cache_dir: data/cache
log_dir: logs
lookback_days: 120
timeframe: daily
max_symbols: 350
min_price: 5
max_price: 500
min_avg_volume: 150000   # scan admission floor on IEX single-exchange volume (~2-3% of
                         # consolidated), so 150k IEX ≈ a liquid consolidated name. Lowered
                         # 300k→150k to stop skipping liquid large-caps; the scorer's own
                         # 500k floor (scoring_config) still docks genuinely thin names.
min_dollar_volume: 2000000
score_threshold_watchlist: 70
score_threshold_high_quality: 80
live_trading_enabled: false
scoring_config_path: config/scoring_config.yaml
universe_config_path: config/universe_swing_research_config.yaml
# Staged liquid-universe expansion. This is intentionally capped below a
# full-market screener; discovery rotation should cover the broader list over
# multiple cycles before we consider scanning thousands of symbols directly.

candidate_snapshots:
  enabled: true
  min_score: 60
  include_roles:
    - primary_candidate
    - speculative_candidate
  include_categories:
    - Breakout Watch
    - Pullback Watch
    - Momentum Continuation
    - Base Building
    - Speculative Watchlist
  exclude_categories:
    - Weak / Avoid
    - Overextended / Wait
    - Insufficient Data
    - ETF / Benchmark Reference
  include_benchmarks: false
  include_references: false
  allow_invalid_trade_plans: false
  dedupe_minutes: 60

snapshot_followup:
  same_bar_target_stop_policy: conservative_stop_first
  expire_after_trading_days: 20

entry_trigger_simulation:
  enabled: true
  default_buffer_pct: 0.001
  expire_after_trading_days: 1
  use_planned_price_as_fill: true
  intraday_timeframe: 5Min

demo_snapshot_seed:
  enabled: false
  count: 12
  days_back_start: 25
  dedupe: true
  note_prefix: "Demo seeded snapshot"

scheduled_watch:
  enabled: true
  interval_minutes: 5
  run_snapshot_update_after_scan: true
  max_cycles:
  market_hours_only: true
  premarket_enabled: true
  afterhours_enabled: true
  start_time: "09:35"
  end_time: "16:10"
  timezone: "America/New_York"
  write_heartbeat_log: true
  heartbeat_enabled: true
  stale_heartbeat_minutes: 10
  stop_file: "data/STOP_WATCH_MODE"

market_data:
  provider: alpaca_iex
  real_data_only: true
  fallback_provider:
  real_provider_enabled: true
  alpaca:
    enabled: true
    feed: iex
    timeframe: 1Day
    max_symbols_per_scan: 350   # per-cycle scan cap; served by chunked batch requests
    max_symbols_per_batch: 175  # wire chunk size — symbols per HTTP request (Alpaca-safe)
    batch_requests_enabled: true
    max_requests_per_minute: 175
    request_buffer_percent: 15
    request_sleep_seconds: 0.25
    stop_on_rate_limit: false
    fallback_on_rate_limit: false
    fail_safe_to_demo: false
    stale_data_minutes: 20
    label_single_exchange_warning: true

symbol_quarantine:
  enabled: true
  apply_during_real_data_only: true
  # Non-destructive: symbols stay in universe YAML; excluded from real-data-only watch/scan.
  symbols:
    - symbol: HCP
      reason: "Repeated Alpaca IEX no-bar / missing real data (legacy HashiCorp ticker on research list)"
    - symbol: SAMSF
      reason: "Repeated Alpaca IEX missing real data (OTC / limited IEX coverage)"
    - symbol: SMAR
      reason: "Repeated Alpaca IEX missing real data (acquired; delisted from active tape)"
    - symbol: SQ
      reason: "Repeated Alpaca IEX missing real data (symbol may not resolve on IEX feed)"
    - symbol: PARA
      reason: "Repeated Alpaca IEX missing real data flagged 2026-05-22 EOD report"
  # Optional replacements are NOT auto-added to the universe file.
  # Add replacements manually to universe YAML with full metadata if desired.
  replacement_symbols: []

intraday:
  enabled: true
  timeframe: 5Min
  lookback_days: 5
  max_symbols_per_cycle: 175
  use_for_scoring: false
  use_for_tony_analysis: true
  require_real_provider: true
  allow_demo_fallback: false

pre_screener:
  enabled: true
  # If fewer than this many symbols pass the filter, fall back to the full list.
  min_symbols_after_filter: 100
  # Use avg_volume_20 / latest_close from recent scan results as a cache.
  use_snapshot_cache: true
  # Ignore symbols with no scan_results row within this many days.
  max_cache_age_days: 7

watch_universe_rotation:
  enabled: true
  # The per-cycle scan cap is market_data.alpaca.max_symbols_per_scan (350); _fetch_bars_batch
  # chunks wire requests at max_symbols_per_batch (175), so 350/cycle = 2 chunked requests.
  # max_symbols_per_cycle must stay aligned with that cap — presenting more than gets scanned
  # wastes the rotation slot. Discovery uses STRIDED sampling: each cycle picks an evenly-spaced
  # comb across the whole ranked shortlist (all score bands / sectors), covering every symbol
  # once per epoch instead of scanning one contiguous score band at a time.
  max_symbols_per_cycle: 350
  core_symbols:
    - SPY
    - QQQ
    - IWM
  core_max_symbols: 50
  rotating_bucket_size: 350   # fill discovery up to the per-cycle cap
  rotation_strategy: strided
  keep_previous_candidates: true
  always_include_open_snapshots: true

research_funnel:
  # Research Funnel v2 — multi-stage pre-Tony shortlisting with FMP/Finnhub/Twelve Data
  # enrichment. DEFAULT OFF. See docs/superpowers/specs/2026-06-03-research-funnel-design.md.
  # When enabled, runs at watch start (after the pre-screener) to feed the rotator a ranked
  # shortlist, and warms a daily recommendation cache by one budget batch each cycle so the
  # WHOLE universe gets analyst-ranked over a few cycles (not just the first enrich_limit).
  # Enrichment feeds are ADVISORY — a missing/failed API never drops a symbol. Needs
  # FMP_API_KEY / FINNHUB_API_KEY in .env to enrich (inert without them).
  enabled: true                  # LIVE 2026-06-04 after close; fail-safe (errors -> pre-screened universe)
  enrich_limit: 50               # legacy one-shot cap (used only when the reco cache is unavailable)
  enrich_per_run: 50             # per-CYCLE Finnhub budget with the daily reco cache on (stays under ~60/min)
  reco_cache_ttl_days: 1         # recommendation-cache freshness; entries refetched after N days
  use_news_sentiment: false      # Finnhub news-sentiment is premium (403 on free) -> skip; rank by recommendation
  # Stage thresholds (map 1:1 to FunnelStageConfig):
  min_price: 5.0
  max_price: 500.0
  min_dollar_volume: 5000000
  min_relative_strength: null    # null = off
  earnings_blackout_days: 5      # drop names reporting within 5 days (uses FMP /stable earnings calendar)
  sentiment_mode: annotate       # annotate | filter
  min_news_sentiment: -1.0       # used only when sentiment_mode: filter
  min_recommendation: null       # null = off
  min_revenue_growth: null       # null = off (e.g. -0.5 drops >50% revenue decline)
  shortlist_size: 1000           # cap on the shortlist fed to the rotator (600 -> 1000 with the ~2k universe)
  weight_relative_strength: 1.0
  weight_sentiment: 0.5
  weight_recommendation: 0.5

tony_stocks:
  enabled: true
  agent_name: "Tony Stocks"
  mode: "watcher"
  create_events_for:
    - scan_started
    - scan_completed
    - snapshots_created
    - snapshots_updated
    - high_score_candidate
    - invalid_trade_plan_blocked
    - outcome_updated
    - warning_summary
    - watch_cycle_completed
    - outcome_analytics_updated
    - data_provider_fallback
    - stale_data_warning
    - system_warning
    - real_provider_active
    - all_symbol_fallback
    - provider_health_passed
    - provider_health_failed
    - real_data_scan_scaled
    - rate_limit_warning
    - universe_rotation_summary
    - batch_fetch_summary
    - provider_fallback_summary
    - analyst_candidate_hypothesis
    - analyst_market_context
    - analyst_data_quality
    - analyst_risk_warning
    - intraday_analysis_summary
    - watch_run_started
    - watch_run_stopped
    - watch_run_error
    - watch_heartbeat_stale
    - watch_waiting_for_market_open
    - tony_learning_updated
    - entry_trigger_summary
    - symbol_quarantine_applied
  high_score_threshold: 85
  include_seeded_demo_events: false
  max_events_per_cycle: 30

vault:
  enabled: true
  vault_dir: vault
  command_center_dir: C:/Users/alexa/Downloads/AI Operations Command Center
  bridge_enabled: true

# Nightly self-learning loop (read-only on trading; design:
# docs/superpowers/specs/2026-06-04-nightly-self-learning-design.md). Grades resolved
# outcomes across dimensions, evolves vault/learning/_knowledge.md, narrates with Claude
# (falls back to deterministic templates without ANTHROPIC_API_KEY), and bridges a brief
# to the Command Center. Never edits config/thresholds/risk.
learning:
  enabled: true
  provider: auto           # auto | gemini | anthropic | none. auto picks by which API key is set.
  gemini_model: gemini-2.5-flash      # used when provider resolves to gemini (GEMINI_API_KEY/GOOGLE_API_KEY)
  anthropic_model: claude-sonnet-4-6  # used when provider resolves to anthropic (ANTHROPIC_API_KEY)
  use_llm: true            # false => deterministic templates only
  min_sample: 5            # per-dimension sample floor before a confident verdict
  lookback_days: 120
  knowledge_history_cap: 30
  bridge_to_cc: true

# Off-hours research engine — read-only pre-open prep (scan, enrich, shortlist). Default OFF.
off_hours:
  enabled: false
  cadence_minutes: 30
  earnings_blackout_days: 5
  shortlist_size: 20
  full_universe_scan: true
  premarket_provider: "null"
  enrich_budget: 25

# Paper-trading execution (Alpaca paper account). OFF by default and INDEPENDENT
# of live_trading_enabled (which stays false and blocks any real-money path).
# A misconfigured-but-enabled block fails closed (treated as disabled). See
# docs/superpowers/specs/2026-06-02-paper-trading-design.md.
paper_trading:
  enabled: true
  risk_per_trade_pct: 1.0          # % of paper equity risked per trade (entry->stop distance)
  max_open_positions: 75
  max_notional_per_position: 1000   # 1% notional cap per NEW entry. MUST track live equity:
                                    # this 'Trading Bot' account is ~$100k, so 1000 = ~1% (correct).
                                    # (The separate CC/Tony $1M account uses 10000.) A wrong value
                                    # here mis-sizes the whole book. Loaded once at watch startup —
                                    # a RESTART is required for a change to take effect.
                                    # KNOWN: legacy positions were sized at ~$5k (5%) under the old
                                    # default cap and run off until target/stop; new entries are 1%.
  max_daily_orders: 200
  max_positions_per_sector: 8       # concentration cap: max concurrent open positions in ONE
                                    # sector (0 = disabled). Per-trade 1% risk does not protect
                                    # against a correlated cohort (e.g. many regional banks) gapping
                                    # together. Gates NEW entries only; never force-closes existing.
                                    # Sector from scan_results.sector -> vault.sector_map fallback;
                                    # unknown/benchmark are uncapped. Loaded at watch startup (restart
                                    # to apply).
  bracket: true                    # entry + stop + target as one bracket
  time_in_force: gtc               # GTC so stop/target protection PERSISTS overnight.
                                   # Entry is a market order (fills at trigger, never rests),
                                   # so "day" would only expire the protective legs at the
                                   # close, leaving positions unprotected. See paper_config.py.
  block_same_day_reentry: true     # do NOT re-buy a symbol the same day it was exited (esp. after a
                                   # stop-out). Without this the duplicate gate releases on close and
                                   # the next cycle re-enters the loser -> loss-churn. See order_router.py.
  gate_on_command_center: false    # trade on Tony's trigger; do not wait for CC verdict
  close_on_command_center_exit: false  # PURE SEPARATION: bot trades its own picks/exits only.
                                       # Tony's verdicts are NOT acted on the bot's book; they are
                                       # recorded as a teaching/divergence memory layer (graded vs
                                       # outcomes) so we can see who was right. See research-funnel/
                                       # tony-teaching spec.
  account_label: Trading Bot              # account identity (room for a future 2nd CC account)
  base_url: https://paper-api.alpaca.markets
