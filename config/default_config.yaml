provider: alpaca_iex
database_path: data/trading_bot.db
outputs_dir: outputs
cache_dir: data/cache
log_dir: logs
lookback_days: 120
timeframe: daily
max_symbols: 100
min_price: 5
max_price: 500
min_avg_volume: 300000
min_dollar_volume: 2000000
score_threshold_watchlist: 70
score_threshold_high_quality: 80
live_trading_enabled: false
scoring_config_path: config/scoring_config.yaml
universe_config_path: config/universe_swing_research_config.yaml

candidate_snapshots:
  enabled: true
  min_score: 60
  include_roles:
    - primary_candidate
    - speculative_candidate
  include_categories:
    - Breakout Watch
    - Pullback Watch
    - Momentum Continuation
    - Base Building
    - Speculative Watchlist
  exclude_categories:
    - Weak / Avoid
    - Overextended / Wait
    - Insufficient Data
    - ETF / Benchmark Reference
  include_benchmarks: false
  include_references: false
  allow_invalid_trade_plans: false
  dedupe_minutes: 60

snapshot_followup:
  same_bar_target_stop_policy: conservative_stop_first
  expire_after_trading_days: 20

demo_snapshot_seed:
  enabled: true
  count: 12
  days_back_start: 25
  dedupe: true
  note_prefix: "Demo seeded snapshot"

scheduled_watch:
  enabled: true
  interval_minutes: 5
  run_snapshot_update_after_scan: true
  max_cycles:
  market_hours_only: false
  premarket_enabled: false
  afterhours_enabled: false
  start_time: "09:35"
  end_time: "16:10"
  timezone: "America/New_York"
  write_heartbeat_log: true
  heartbeat_enabled: true
  stale_heartbeat_minutes: 10
  stop_file: "data/STOP_WATCH_MODE"

market_data:
  provider: alpaca_iex
  fallback_provider: demo_generated
  real_provider_enabled: true
  alpaca:
    enabled: true
    feed: iex
    timeframe: 1Day
    max_symbols_per_scan: 175
    max_symbols_per_batch: 175
    batch_requests_enabled: true
    max_requests_per_minute: 175
    request_buffer_percent: 15
    request_sleep_seconds: 0.25
    stop_on_rate_limit: false
    fallback_on_rate_limit: true
    fail_safe_to_demo: true
    stale_data_minutes: 20
    label_single_exchange_warning: true

watch_universe_rotation:
  enabled: true
  max_symbols_per_cycle: 175
  core_symbols:
    - SPY
    - QQQ
    - IWM
  core_max_symbols: 50
  rotating_bucket_size: 125
  rotation_strategy: round_robin
  keep_previous_candidates: true
  always_include_open_snapshots: true

tony_stocks:
  enabled: true
  agent_name: "Tony Stocks"
  mode: "watcher"
  create_events_for:
    - scan_started
    - scan_completed
    - snapshots_created
    - snapshots_updated
    - high_score_candidate
    - invalid_trade_plan_blocked
    - outcome_updated
    - warning_summary
    - watch_cycle_completed
    - outcome_analytics_updated
    - data_provider_fallback
    - stale_data_warning
    - system_warning
    - real_provider_active
    - all_symbol_fallback
    - provider_health_passed
    - provider_health_failed
    - real_data_scan_scaled
    - rate_limit_warning
    - universe_rotation_summary
    - batch_fetch_summary
    - provider_fallback_summary
    - analyst_candidate_hypothesis
    - analyst_market_context
    - analyst_data_quality
    - analyst_risk_warning
    - watch_run_started
    - watch_run_stopped
    - watch_run_error
    - watch_heartbeat_stale
    - watch_waiting_for_market_open
    - tony_learning_updated
  high_score_threshold: 85
  include_seeded_demo_events: false
  max_events_per_cycle: 30
